substitutions:
  device_name: dormitorio_luz_ventilador
  enable_bluetooth: "false"
  detatched_mode: "false"

packages:
  - !include 
    file: ../sonoff-mini-r4/defaults.yaml
    vars: 
      device_name: ${device_name}
      enable_bluetooth: ${enable_bluetooth}

sensor: !include 
  file: ../sonoff-mini-r4/sensors.yaml
  vars: 
    device_name: ${device_name}

text_sensor:
  - platform: wifi_info
    ssid:
      name: "Connected SSID"
    ip_address:
      name: "IP Address"

## Physical switch to control the relay and the relay LED

#esp32_ble_tracker:
#  scan_parameters:
#    interval: 1100ms
#    window: 1100ms

#bluetooth_proxy:


switch:
  - platform: gpio
    name: Rele MiniR4
    pin:
      number: GPIO26
      inverted: false
    id: relay
    on_turn_on:
      - light.turn_on: relay_led
    on_turn_off:
      - light.turn_off: relay_led

output:
  - platform: gpio
    pin: GPIO19
    inverted: True
    id: relay1_led_gpio

light:
  - platform: binary
    name: "Relay LED"
    id: relay_led
    internal: true    
    output: relay1_led_gpio

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO27
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Interruptor S2"
    id: external_switch
    # Opcional: Filtro para evitar rebotes eléctricos de la red
    filters:
      - delayed_on_off: 60ms
#    on_state:
#      if:
#        condition:
#          not:
#            api.connected:
#        then:
#          - switch.toggle: relay
  - platform: gpio
    internal: true
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: false
    name: Mini R4 Boton
    on_press:
      - switch.toggle: relay