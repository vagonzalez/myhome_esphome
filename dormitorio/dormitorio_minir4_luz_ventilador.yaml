substitutions:
  device_name: sonoff-mini-r4
  friendly_name: "Sonoff Mini R4"


# =============================================================================
# ESPHOME
# =============================================================================

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Sonoff MINI R4 - Detached relay with HA fail-safe"

  # Apply the selected power-on behaviour only after all persistent
  # configuration entities have been restored.
  on_boot:
    priority: -100
    then:
      - lambda: |-
          const auto mode = id(power_restore_mode).current_option();

          if (mode == "Always On") {
            id(relay).turn_on();
          } else if (mode == "Restore Previous") {
            if (id(relay_last_state)) {
              id(relay).turn_on();
            } else {
              id(relay).turn_off();
            }
          } else {
            // "Always Off"
            id(relay).turn_off();
          }

      # From this point onwards, genuine relay changes may update
      # the stored previous state.
      - lambda: |-
          id(boot_complete) = true;


esp32:
  variant: ESP32
  framework:
    type: esp-idf


# =============================================================================
# FLASH / PERSISTENCE
# =============================================================================

preferences:
  # Batch persistent writes to reduce flash wear.
  flash_write_interval: 5min


# =============================================================================
# NETWORK
# =============================================================================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

captive_portal:


# =============================================================================
# HOME ASSISTANT API
# =============================================================================

api:
  id: api_server
  encryption:
    key: !secret api_encryption_key


# =============================================================================
# OTA
# =============================================================================

ota:
  - platform: esphome
    password: !secret ota_password


# =============================================================================
# LOGGING
# =============================================================================

logger:
  level: INFO


# =============================================================================
# STATUS LED
# =============================================================================

status_led:
  pin:
    number: GPIO19
    inverted: true


# =============================================================================
# INTERNAL STATE
# =============================================================================

globals:

  # Last genuine relay state.
  #
  # Only one persistent boolean is required.
  # Writes are delayed by flash_write_interval above.
  - id: relay_last_state
    type: bool
    restore_value: true
    initial_value: "false"

  # RAM only.
  #
  # Prevents the boot restore operation itself from overwriting
  # relay_last_state.
  - id: boot_complete
    type: bool
    restore_value: false
    initial_value: "false"


# =============================================================================
# CONFIGURATION SELECTS
# =============================================================================

select:

  # ---------------------------------------------------------------------------
  # DETACHED RELAY MODE
  # ---------------------------------------------------------------------------

  - platform: template
    id: relay_mode
    name: "Relay Mode"
    icon: mdi:electric-switch
    entity_category: config

    options:
      - "Normal"
      - "Detached"

    initial_option: "Normal"
    optimistic: true
    restore_value: true


  # ---------------------------------------------------------------------------
  # POWER-ON RESTORE MODE
  #
  # Always Off:
  #     Relay remains OFF after reboot.
  #
  # Always On:
  #     Relay turns ON after boot.
  #
  # Restore Previous:
  #     Relay returns to the last recorded state.
  # ---------------------------------------------------------------------------

  - platform: template
    id: power_restore_mode
    name: "Power-on Restore Mode"
    icon: mdi:restart
    entity_category: config

    options:
      - "Always Off"
      - "Always On"
      - "Restore Previous"

    initial_option: "Always Off"
    optimistic: true
    restore_value: true


  # ---------------------------------------------------------------------------
  # MANUAL OVERRIDE
  #
  # Automatic:
  #     Normal detached-mode behaviour.
  #
  # Force Manual:
  #     S1/S2 always controls the relay locally.
  #     Detached mode and HA connection state are ignored.
  # ---------------------------------------------------------------------------

  - platform: template
    id: manual_mode
    name: "Manual Mode"
    icon: mdi:hand-back-right
    entity_category: config

    options:
      - "Automatic"
      - "Force Manual"

    initial_option: "Automatic"
    optimistic: true
    restore_value: true


# =============================================================================
# RELAY
# =============================================================================

switch:

  - platform: gpio
    id: relay
    name: "Relay"

    pin: GPIO26

    # IMPORTANT:
    #
    # Always initialise safely OFF at the hardware-switch level.
    # Our Power-on Restore Mode is applied later in esphome.on_boot.
    #
    # This prevents the relay from briefly assuming a previously stored
    # state before our configuration select has been restored.
    restore_mode: ALWAYS_OFF

    on_turn_on:
      then:
        - if:
            condition:
              lambda: |-
                return id(boot_complete);
            then:
              - lambda: |-
                  id(relay_last_state) = true;

    on_turn_off:
      then:
        - if:
            condition:
              lambda: |-
                return id(boot_complete);
            then:
              - lambda: |-
                  id(relay_last_state) = false;


# =============================================================================
# INPUTS
# =============================================================================

binary_sensor:

  # ---------------------------------------------------------------------------
  # S1 / S2 WALL SWITCH
  #
  # S1 = GND
  # S2 = GPIO27
  #
  # A maintained/toggle wall switch is assumed.
  # Both physical transitions therefore count as an action.
  # ---------------------------------------------------------------------------

  - platform: gpio
    id: wall_switch
    name: "Wall Switch"

    pin:
      number: GPIO27

    filters:
      - invert:
      - delayed_on: 30ms
      - delayed_off: 30ms

    on_state:
      then:

        # Effective detached mode requires ALL of these:
        #
        #   1. Relay Mode = Detached
        #   2. Manual Mode = Automatic
        #   3. Home Assistant is connected
        #
        # If any condition is false, local relay control is retained.

        - if:
            condition:
              and:

                - lambda: |-
                    return id(relay_mode).current_option() == "Detached";

                - lambda: |-
                    return id(manual_mode).current_option() == "Automatic";

                - api.connected:
                    state_subscription_only: true

            then:

              # Detached mode is genuinely active.
              #
              # Publish the wall-switch state to HA but leave
              # the physical relay unchanged.
              - logger.log:
                  level: INFO
                  format: "Wall switch changed - detached mode active"

            else:

              # Local operation applies when:
              #
              # - Relay Mode = Normal
              # - Manual Mode = Force Manual
              # - HA is unavailable
              #
              - switch.toggle: relay


  # ---------------------------------------------------------------------------
  # ONBOARD MINI R4 BUTTON
  #
  # Always provides direct relay control.
  # ---------------------------------------------------------------------------

  - platform: gpio
    id: onboard_button
    internal: true

    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true

    filters:
      - delayed_on: 30ms

    on_press:
      then:
        - switch.toggle: relay