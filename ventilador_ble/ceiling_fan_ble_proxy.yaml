esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "BLE ADV Proxy for ESP32 devices"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

logger:
  level: INFO

api:
  custom_services: true
  homeassistant_services: true

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Ventilador BLE Proxy Fallback"

captive_portal:

web_server:
  port: 80
  version: 3

text_sensor:
  - platform: wifi_info
    ssid:
      name: "Connected SSID"
    ip_address:
      name: "IP Address"

# ---------------------------------------------------------
# ha-ble-adv BLE advertising proxy
# ---------------------------------------------------------

external_components:
  - source: github://NicoIIT/esphome-ble_adv_proxy

ble_adv_proxy:
  use_max_tx_power: true

# ---------------------------------------------------------
# BLE scanner
# ---------------------------------------------------------

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 320ms # Eliminar si se actualiza a ESPHome 2026.8 o superior, ya que se ha corregido el error de compilación en la plataforma esp32_ble_tracker
    window: 300ms   # Eliminar si se actualiza a ESPHome 2026.8 o superior, ya que se ha corregido el error de compilación en la plataforma esp32_ble_tracker

# Optional diagnostic restart button in Home Assistant
button:
  - platform: restart
    name: "Restart BLE ADV Proxy"
